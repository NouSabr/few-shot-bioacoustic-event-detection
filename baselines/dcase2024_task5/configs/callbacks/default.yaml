model_checkpoint:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  monitor: "val/acc" # name of the logged metric which determines when model is improving
  mode: "max" # "max" means higher metric value is better, can be also "min"
  save_top_k: 1 # save k best models (determined by above metric)
  save_last: True # additionaly always save model from last epoch
  verbose: False
  dirpath: "checkpoints/"
  filename: "epoch_{epoch:03d}_val_acc_{val/acc:.2f}"
  auto_insert_metric_name: False

early_stopping:
  _target_: pytorch_lightning.callbacks.EarlyStopping
  monitor: "val/acc" # name of the logged metric which determines when model is improving
  mode: "max" # "max" means higher metric value is better, can be also "min"
  patience: 10 # how many validation epochs of not improving until training stops
  min_delta: 0.0 # minimum change in the monitored metric needed to qualify as an improvement

model_summary:
  _target_: pytorch_lightning.callbacks.RichModelSummary
  max_depth: -1

# rich_progress_bar:
#   _target_: pytorch_lightning.callbacks.RichProgressBar

prototype_visualization:
  _target_: src.callbacks.prototype_visualization_callback.PrototypeVisualizationCallback
  viz_episode_freq: 1000  # Visualize every 1000 episodes
  reduction_method: "pca"  # Options: 'pca', 'incremental_pca', 'umap'
  n_components: 2
  save_to_disk: false  # Set to true to save figures locally
  output_dir: "visualizations/"
  use_cache: true  # Cache reducer for consistency across episodes
  figsize: [12, 8]
  dpi: 100
  log_to_wandb: true  # Log to WandB if available
  log_to_tensorboard: false  # Log to TensorBoard if available

frequency_masking:
  _target_: src.callbacks.frequency_masking_callback.FrequencyMaskingCallback
  log_freq: 1000  # Log masking stats every 1000 batches (0 to disable periodic logging)
